# Overlay form for a cloud system. A FORM, not a filled copy: nothing here names a
# real package, system, transport or component. Fill in your own.
#
# Copy it to ../test-config.overlay.yaml (gitignored) — or run
#   npm run test:init -- cloud
# Every `<LIKE_THIS>` must be replaced: the loader refuses a placeholder. An empty
# entry (`key:` with nothing) is refused; write "" where empty is meant. Flags
# are unquoted true/false. Turning an optional ATC case on needs its check_variant.
# Keys are written FLAT (one path per line); a case inside a list is picked by
# its name in [brackets]. Only these keys are allowed; the rest is the base,
# ../test-config.yaml.template.

# --- Required ---
# Which kind of system. Stated, never guessed.
"environment.system": "cloud"
# Your dev package (Z*/Y*) or "$TMP" for local objects. Create it by hand first; tests only create objects inside it.
"environment.default_package": "<DEV_PACKAGE>"
# The ONE transport request every run reuses and never releases ("" for $TMP/local packages).
"environment.default_transport": "<TRANSPORT_REQUEST>"
# SAP system id (on-prem only; "" on cloud, which supplies it).
"environment.default_master_system": ""
# Prove each UNLOCK released its lock from a second ABAP session (on: any refusal fails; off: not made, said in the run). false on cloud: a second session can land on a server that cannot see a new object yet (404, measured 2026-10-24); a BTP trial passed with true on 2026-10-25, so the 404 comes some runs, not every run.
"environment.verify_lock_released": false
# Read the message class right after its create (on: any refusal fails; off: not read, said in the run). false on cloud: the same 404, which also comes some runs only (a BTP trial passed with true on 2026-10-25).
"environment.read_message_class_after_create": false
# Validate a transformation's name before its create (on: any refusal fails; off: not sent, said in the run). false where the system has no /sap/bc/adt/xslt/validation (404).
"environment.validate_transformation_names": true
# Name of the shared package on THIS system (created by `npm run shared:setup` inside super_package).
"shared_dependencies.package": "<SHARED_PACKAGE>"
# Parent of the shared package; normally the same as environment.default_package.
"shared_dependencies.super_package": "<DEV_PACKAGE>"
# Software component of the shared package ("" on cloud).
"shared_dependencies.software_component": ""
# Transport layer of the shared package ("" on cloud).
"shared_dependencies.transport_layer": ""
# Change recording of the shared package: true under a transportable component (SAP refuses it otherwise, TR432), false on cloud.
"shared_dependencies.record_changes": false
# Existing parent package for the package the create test makes (structure/main type).
"create_package.test_cases[adt_package].params.package_name": "<PARENT_PACKAGE>"
# Software component for that package; cloud systems use their own local component.
"create_package.test_cases[adt_package].params.software_component": "<SOFTWARE_COMPONENT>"
# Transport layer for that package (required on-prem while change recording is on; "" on cloud).
"create_package.test_cases[adt_package].params.transport_layer": ""
# Transport target as SE10 shows it, WITHOUT the slashes (on-prem; "" on cloud).
"create_transport.test_cases[builder_transport].params.target_system": ""

# --- Optional: uncomment to override the base default ---
# Transport mechanism: "rfc" or "http".
# "environment.connection_type": "rfc"
# Name of the scalar function the test creates, if the base name collides.
# "create_scalar_function.test_cases[adt_scalar_function].params.scalar_function_name": "<NAME>"
# Name of its implementation, if the base name collides.
# "create_scalar_function_implementation.test_cases[adt_scalar_function_implementation].params.implementation_name": "<NAME>"
# Name of the append structure, if the base name collides.
# "create_append_structure.test_cases[adt_append_structure].params.append_structure_name": "<NAME>"
# false where the system has no scalar functions (DSFD): a refused create fails, it is not skipped.
# "create_scalar_function.test_cases[adt_scalar_function].enabled": false
# false where the system has no scalar function implementations (DSFI).
# "create_scalar_function_implementation.test_cases[adt_scalar_function_implementation].enabled": false
# false where the system has no append structures.
# "create_append_structure.test_cases[adt_append_structure].enabled": false
# true only where the system allows creating feature toggles (#131); a refusal fails the test.
# "create_feature_toggle.test_cases[adt_feature_toggle].enabled": true
# false where the system refuses `check` (e.g. S_ABPLNGVS); a refusal fails the test.
# "check_run.test_cases[class_check].enabled": false
# "default_package" where the system has no shared package (e.g. a BTP trial without a transport layer); a failed shared setup fails the test.
# "create_function_module.test_cases[adt_function_module].params.function_group_route": "default_package"
# "default_package" where the system has no shared package; a failed shared setup fails the test.
# "create_function_include.test_cases[adt_function_include].params.function_group_route": "default_package"
# true once a check variant that runs on this system is set.
# "atc_run.test_cases[adt_atc_run].enabled": true
# ATC check variant, or "" for the system's own.
# "atc_run.test_cases[adt_atc_run].params.check_variant": "<CHECK_VARIANT>"
# Pin the finding's message id (set with expected_priority, or neither).
# "atc_run.test_cases[adt_atc_run].params.expected_message_id": "<MESSAGE_ID>"
# Pin the finding's priority (set with expected_message_id, or neither).
# "atc_run.test_cases[adt_atc_run].params.expected_priority": 2
# true once the system holds the objects to check.
# "atc_object_kinds.test_cases[adt_atc_object_kinds].enabled": true
# ATC check variant when the system's nominated one does not run.
# "atc_object_kinds.test_cases[adt_atc_object_kinds].params.check_variant": "<CHECK_VARIANT>"
# On-prem: a standard program the system has, if it lacks the base one.
# "enhancement.test_cases[program_host].params.program_name": "<PROGRAM>"
# On-prem: a standard function group, if the system lacks the base one.
# "enhancement.test_cases[function_group_host].params.function_group_name": "<FUNCTION_GROUP>"
# On-prem: a standard include, if the system lacks the base one (set with main_program).
# "enhancement.test_cases[include_host].params.include_name": "<INCLUDE>"
# On-prem: the main program of that include.
# "enhancement.test_cases[include_host].params.main_program": "<MAIN_PROGRAM>"
# The generic ABAP Unit runner's live cases (off by default): turn each on and name the local package its objects go into — a package of the local software component (ZLOCAL).
# "run_abap_unit.test_cases[adt_abap_unit_class_run].enabled": true
# "run_abap_unit.test_cases[adt_abap_unit_class_run].params.package_name": "<LOCAL_PACKAGE>"
# "run_abap_unit.test_cases[adt_abap_unit_cds_run].enabled": true
# "run_abap_unit.test_cases[adt_abap_unit_cds_run].params.package_name": "<LOCAL_PACKAGE>"
# "run_abap_unit.test_cases[adt_abap_unit_package_run].enabled": true
# "run_abap_unit.test_cases[adt_abap_unit_package_run].params.package_name": "<LOCAL_PACKAGE>"
