name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.1.0, v1.2.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create package
        run: npm pack

      - name: Get package filename
        id: package
        run: |
          PACKAGE_FILE=$(ls mcp-abap-adt-adt-clients-*.tgz)
          echo "filename=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "Package created: $PACKAGE_FILE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # A release for this tag may already exist, written by hand before the tag
      # was pushed. Its notes are the ones worth keeping — the workflow's are a
      # fallback, not an improvement on them.
      - name: Is there already a release for this tag?
        id: existing
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the package and touch nothing else. `--clobber` replaces the
      # asset rather than failing on a second run, so a rerun changes nothing.
      - name: Attach the package to the existing release
        if: steps.existing.outputs.exists == 'true'
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.filename }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only when nobody wrote one: then there are no notes to protect, and the
      # generated changelog is better than an empty release.
      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.filename }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            Download the `.tgz` package and install:

            ```bash
            npm install -g ./${{ steps.package.outputs.filename }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
