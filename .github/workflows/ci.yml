name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-build:
    # A hung step is capped here instead of by GitHub's 6-hour default; a
    # whole run takes 2 to 5 minutes.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # One install at the root: the packages are npm workspaces, and the
      # root lockfile covers them all. Every third-party package comes from
      # the registry; only the workspace siblings are linked.
      #
      # --ignore-scripts: the runner's npm may predate 11.19.0, which reads
      # package.json `allowScripts` and .npmrc `strict-allow-scripts` in full,
      # and no dependency's install script is needed to lint, build or test —
      # `allowScripts` denies every one of them. It also skips the root's own
      # `prepare` (husky), which CI has no use for.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Any known advisory of moderate severity or above fails the run, dev
      # dependencies included: they run here and on every developer's
      # machine. The root lockfile is the one tree of every package.
      - name: Security audit (moderate+)
        run: npm audit --audit-level=moderate

      # Every package, each with its own build: adt-clients lints its `src`
      # (errors only) and compiles it, the strategies package writes its
      # ERRATA.md and compiles.
      - name: Build
        run: npm run build

      # Tests, scripts and examples are type-checked by their own configs. The
      # build covers `src` alone, so a script or an example naming a member
      # that no longer exists compiled nowhere until this step existed.
      - name: Type check tests, scripts and examples
        run: npm run test:check

      # Biome over every package's sources and the root tools, then every
      # package's documentation imports.
      - name: Lint and documentation imports
        run: npm run lint:check

      # No SAP system here, so the integration suites are out of reach — but
      # the unit suites are not, and they carry every invariant this release
      # is built on. `MCP_ENV_PATH` points at nothing so the preflight skips
      # instead of aborting the run. The strategies package is tested
      # entirely against the recorded answers in adt-clients' `corpus/adt/` (`answers/`, `debugger/`),
      # so it needs no system at all.
      - name: Unit tests
        run: MCP_ENV_PATH=/tmp/nonexistent-env npm test

      # Every file each package declares is in what `npm pack` would ship —
      # with --ignore-scripts, as the release publishes.
      - name: Packed contents
        run: npm run check:packed

      # The publish script against throwaway repositories with a fake npm,
      # then against this repository's own manifests with --dry-run: no
      # registry credentials, nothing published.
      - name: Publish path
        run: npm run check:publish

      - name: Publish path, this repository's manifests
        run: npm run check:publish:root

      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- npm audit: OK"
          echo "- Build, every package: OK"
          echo "- TypeScript, test configs: OK"
          echo "- Biome lint and documentation imports: OK"
          echo "- Unit tests and strategies tests: OK"
          echo "- Packed contents and publish path: OK"
